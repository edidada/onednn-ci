name: CI Verify (eulixos/onednn)

on:
  push:
    branches: ["ci/gha-verify"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Clone upstream source (Gitee)
        run: git clone --depth=1 https://gitee.com/eulixos/onednn.git source
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ ccache
      - name: Configure
        working-directory: source
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DONEDNN_BUILD_EXAMPLES=OFF \
            -DONEDNN_BUILD_TESTS=OFF
      - name: Build
        working-directory: source
        run: cmake --build build -j 4
      - name: Show artifacts
        working-directory: source
        run: find build -name "libdnnl*.so*" | head -5
