name: CI Verify (eulixos/onednn)

on:
  push:
    branches: ["ci/gha-verify"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Clone upstream source (Gitee)
        run: git clone --depth=1 https://gitee.com/eulixos/onednn.git source
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ unzip
      - name: Build oneDNN snapshot (OSPP 2026)
        working-directory: source/summer_ospp_2026
        run: |
          set -e
          unzip -q oneDNN-*.zip
          srcdir=$(ls -d oneDNN-* | head -1)
          echo "building $srcdir"
          cmake -S "$srcdir" -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DONEDNN_BUILD_TESTS=OFF \
            -DONEDNN_BUILD_EXAMPLES=OFF \
            -DONEDNN_LIBRARY_TYPE=SHARED
          cmake --build build -j 4
      - name: Show artifacts
        working-directory: source/summer_ospp_2026
        run: find build -name "libdnnl*" -maxdepth 3 | head -5
